<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проверка адаптивности учебника</title>
<style>*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#e8ecf3;color:#1b273d}header{height:56px;padding:8px 24px;display:flex;align-items:center;gap:20px;background:white;border-bottom:1px solid #d0d7e5}select,button{font:inherit;padding:8px;border:1px solid #cbd4e5;background:white;border-radius:7px}main{padding:18px;display:flex;justify-content:center;align-items:flex-start}iframe{display:block;width:100%;height:820px;border:0;background:#fff}#screen{width:390px;max-width:100%;border:1px solid #c3cddd;box-shadow:0 12px 32px #12244920}a{color:#3155e7;text-decoration:none;margin-left:auto}</style></head>
<body><header><label for="width">Ширина экрана</label><select id="width"><option value="320">320 px</option><option value="390" selected>390 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select><span>Проверка реальной страницы в отдельном окне</span><a href="../index.html">Открыть учебник</a></header><main><div id="screen"><iframe title="Учебник Конституции" src="../index.html"></iframe></div></main>
<script>document.getElementById('width').onchange=function(){document.getElementById('screen').style.width=this.value+'px';};</script></body></html>
